<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>СпортПульс</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Свежие новости футбола, хоккея, баскетбола, тенниса и единоборств.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__row">
      <a href="#all" class="logo">Спорт<span>Пульс</span></a>
      <nav class="nav" id="nav"></nav>
      <button class="menu-btn" id="menu-btn" aria-label="Меню">☰</button>
    </div>
    <div class="ticker"><div class="container"><b>LIVE</b> Хоккей: Команда В — Команда Г 1:1, 2-й период</div></div>
  </header>

  <main class="container layout">
    <div>
      <div id="home-view">
        <section id="hero"></section>
        <h2 class="section-title" id="feed-title">Последние новости</h2>
        <section class="grid" id="feed"></section>
      </div>
      <div id="article-view" hidden>
        <article class="article" id="article"></article>
        <section id="related"></section>
      </div>
    </div>

    <aside>
      <section class="widget"><h2>Результаты</h2><ul id="scores"></ul></section>
      <section class="widget"><h2>Популярное</h2><ol id="popular"></ol></section>
      <section class="widget subscribe">
        <h2>Подписка</h2>
        <form id="subscribe-form">
          <input id="subscribe-email" type="email" placeholder="Ваш email" required>
          <button class="btn" type="submit">Подписаться</button>
        </form>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <div class="container footer__row">
      <div>© <span id="year"></span> СпортПульс — спортивные новости</div>
      <div><a href="#all">О проекте</a><a href="#all">Контакты</a><a href="#all">Telegram</a></div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
